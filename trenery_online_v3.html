<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тренери by L1Nk</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1425;color:#eaf1ff;font:15px system-ui,Arial}header{position:sticky;top:0;background:#111f35;padding:16px;z-index:2;border-bottom:1px solid #29415e}h1{font-size:23px;margin:0}small,.muted{color:#a6b8ce}main{padding:14px;max-width:780px;margin:auto}.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.team,.coach{border:1px solid #355070;border-radius:12px;background:#1b2d47;color:inherit;padding:14px;text-align:left;cursor:pointer}.team strong{display:block;font-size:15px}.team span{display:block;color:#b5c9de;font-size:12px;margin-top:7px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}button{font:inherit}.back{background:#2e4971;color:white;border:0;padding:10px;border-radius:9px}.coaches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.coach{min-height:76px;position:relative;padding:9px 10px;border-radius:9px}.coach .num{font-size:10px;color:#a7bad0}.coach strong{display:block;margin-top:5px;font-size:12px;line-height:1.2}.coach.used{background:#10151f;border-color:#303744;color:#79818e}.coach.used strong{text-decoration:line-through}.coach .state{display:block;margin-top:5px;font-size:10px;color:#76e6b2}.coach.used .state{color:#a5a7b0}.notice{background:#1a2b43;border:1px solid #3b5270;border-radius:10px;padding:11px;margin:12px 0;color:#c7d8ea}.stats{margin:0 0 12px;color:#b7cee4}footer{padding:22px;text-align:center;color:#8ea3b9;font-size:12px}</style></head><body><header><h1>⚽ Тренери <small>by L1Nk</small></h1><small>Спільна версія · 16 команд · 30 тренерів</small></header><main id="app"></main><footer>Синхронізація через Firebase Realtime Database · by L1Nk</footer><script type="module">

let data={};let selected=null;const app=document.getElementById('app');function count(i){return Object.values(data[i]||{}).filter(Boolean).length}function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function render(){app.replaceChildren();const status=el('div','notice',err?'⚠ '+err:(online?'🟢 Спільна база підключена':'⏳ Підключення до спільної бази…'));app.append(status);if(selected===null){app.append(el('p','muted','Обери команду, щоб відзначити вже використаних тренерів.'));const grid=el('div','teams');teams.forEach((t,i)=>{const b=el('button','team');b.append(el('strong','',`${i+1}. ${t}`),el('span','',`${count(i)} використано · ${30-count(i)} доступно`));b.onclick=()=>{selected=i;render();window.scrollTo(0,0)};grid.append(b)});app.append(grid);return}const top=el('div','top'),back=el('button','back','← Команди');back.onclick=()=>{selected=null;render()};top.append(back,el('strong','',teams[selected]));app.append(top,el('p','stats',`Використано: ${count(selected)} / 30 · Доступно: ${30-count(selected)}`));app.append(el('div','notice','Натисни на тренера, щоб позначити його використаним. Натисни ще раз, щоб скасувати.'));const grid=el('div','coaches');coaches.forEach((name,i)=>{const used=!!data[selected]?.[i],b=el('button','coach'+(used?' used':''));b.setAttribute('aria-pressed',String(used));b.append(el('span','num',`№ ${i+1}`),el('strong','',name),el('span','state',used?'● Використаний':'✓ Доступний'));b.onclick=async()=>{b.disabled=true;try{await runTransaction(ref(db,`teams/${selected}/${i}`),current=>!current)}catch(e){err='Не вдалося зберегти: '+e.message;render()}finally{b.disabled=false}};grid.append(b)});app.append(grid)}onValue(ref(db,'teams'),snap=>{data=snap.val()||{};online=true;err='';render()},e=>{online=false;err='Немає доступу до бази. Перевір правила Firebase: '+e.message;render()});render();
